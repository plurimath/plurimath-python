[build-system]
requires = ["setuptools>=69", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "plurimath"
version = "0.1.0"
description = "Native Plurimath evaluator for serialized requests"
requires-python = ">=3.9"
license = {file = "LICENSE"}
readme = "README.md"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
